
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HENZA HOME | فروشگاه سه‌بعدی</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Tahoma,Arial;background:#eee}
#scene{position:fixed;inset:0}
#entrance{position:fixed;inset:0;z-index:10;background:#171511 url('image-1794985931564.jpg') center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding:30px}
#entrance:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#0009)}
#enter{position:relative;z-index:1;background:#a17b3c;color:white;border:1px solid #e4c98e;border-radius:12px;padding:16px 28px;font:bold 17px Tahoma}
#brand{position:fixed;z-index:4;top:12px;right:12px;background:#fffE;padding:12px 16px;border-radius:12px;color:#9b753a;font-weight:bold}
#help{position:fixed;z-index:4;top:12px;left:12px;background:#fffE;border-radius:12px;padding:10px;font-size:11px}
#joy{position:fixed;z-index:5;bottom:20px;left:20px;width:112px;height:112px;border:2px solid #fff;background:#ffffff55;border-radius:50%;touch-action:none}
#knob{position:absolute;left:33px;top:33px;width:42px;height:42px;border-radius:50%;background:#a17b3c;box-shadow:0 2px 8px #0005}
#note{position:fixed;z-index:4;bottom:24px;right:14px;background:#fffE;border-radius:10px;padding:10px;font-size:11px;line-height:1.8}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#f6f2e9;color:#4c4030}
@media(min-width:700px){#joy{display:none}#note:after{content:" | حرکت با W A S D و نگاه با ماوس"}}
</style>
</head>
<body>
<div id="loading">در حال بارگذاری فروشگاه HENZA HOME...</div>
<div id="entrance"><button id="enter">ورود به فروشگاه HENZA HOME</button></div>
<div id="scene"></div>
<div id="brand">HENZA HOME</div>
<div id="help">برای دیدن قفسه‌ها حرکت کن</div>
<div id="joy"><div id="knob"></div></div>
<div id="note">نمایش سه‌بعدی با عکس‌های واقعی فروشگاه<br>دسته را به چپ، راست، بالا و پایین بکش</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.querySelector('#scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x252321);
scene.fog=new THREE.Fog(0x252321,20,48);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.65,8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x776b5b,2.0));
const light=new THREE.DirectionalLight(0xffe2b0,2.2);
light.position.set(2,8,5);
light.castShadow=true;
scene.add(light);

const mat=(c,r=.65,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});

function box(x,y,z,w,h,d,m){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);
 o.receiveShadow=true;
 o.castShadow=true;
 scene.add(o);
 return o;
}

const floorMat=mat(0xd6d0c5,.25);
const wallMat=mat(0x383632,.8);
const trim=mat(0x9d8054,.35,.45);

box(0,-.13,0,22,.25,26,floorMat);
box(0,4,-12,22,8,.3,wallMat);
box(-11,4,0,.3,8,24,wallMat);
box(11,4,0,.3,8,24,wallMat);
box(0,7.9,0,22,.2,24,mat(0x292725));

// عکس‌های واقعی فروشگاه
const loader=new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');

const photos=[
'image-1794985942259.jpg',
'image-1794985956292.jpg'
];

function photoPanel(url,x,z,w,h,rotation=0){
 const tex=loader.load(url,()=>{},undefined,()=>console.warn('بارگذاری عکس ناموفق:',url));
 tex.colorSpace=THREE.SRGBColorSpace;

 const mesh=new THREE.Mesh(
  new THREE.PlaneGeometry(w,h),
  new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide})
 );
 mesh.position.set(x,2.8,z);
 mesh.rotation.y=rotation;
 scene.add(mesh);

 const frame=new THREE.Mesh(
  new THREE.BoxGeometry(w+.14,h+.14,.12),
  trim
 );
 frame.position.set(x,2.8,z-.07);
 frame.rotation.y=rotation;
 scene.add(frame);

 mesh.position.z += rotation===0 ? -.14 : 0;
 return mesh;
}

photoPanel(photos[0],-7.5,-5,6.5,8,Math.PI/2);
photoPanel(photos[1],7.5,1,6.5,8,-Math.PI/2);
photoPanel(photos[1],-7.5,5,6.5,8,Math.PI/2);
photoPanel(photos[0],7.5,-7,6.5,8,-Math.PI/2);

// چراغ‌های سقف
for(let z=-9;z<=7;z+=4){
 const lamp=new THREE.Mesh(
  new THREE.BoxGeometry(2.2,.06,.35),
  new THREE.MeshBasicMaterial({color:0xffe5b5})
 );
 lamp.position.set(0,7.75,z);
 scene.add(lamp);

 const pl=new THREE.PointLight(0xffdca3,1.1,7);
 pl.position.set(0,6.8,z);
 scene.add(pl);
}

// تابلو فروشگاه
const signCanvas=document.createElement('canvas');
signCanvas.width=1024;
signCanvas.height=256;
const ctx=signCanvas.getContext('2d');
ctx.fillStyle='#201f1d';
ctx.fillRect(0,0,1024,256);
ctx.fillStyle='#c6a16a';
ctx.font='bold 112px Arial';
ctx.textAlign='center';
ctx.fillText('HENZA HOME',512,165);

const signTex=new THREE.CanvasTexture(signCanvas);
const sign=new THREE.Mesh(
 new THREE.PlaneGeometry(5,1.25),
 new THREE.MeshBasicMaterial({map:signTex})
);
sign.position.set(0,4,-11.7);
scene.add(sign);

// کنترل دوربین
let yaw=0,pitch=0;
const keys={};

addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let drag=false,lastX=0,lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'){
  drag=true;
  lastX=e.clientX;
  lastY=e.clientY;
 }
});

addEventListener('pointerup',()=>drag=false);

addEventListener('pointermove',e=>{
 if(drag){
  yaw-=(e.clientX-lastX)*.004;
  pitch-=(e.clientY-lastY)*.003;
  pitch=THREE.MathUtils.clamp(pitch,-.8,.8);
  lastX=e.clientX;
  lastY=e.clientY;
 }
});

// دسته گرد گوشی
const joy=document.querySelector('#joy');
const knob=document.querySelector('#knob');
let jx=0,jy=0;

function moveJoy(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const l=Math.hypot(x,y),max=35;

 if(l>max){
  x=x/l*max;
  y=y/l*max;
 }

 jx=x/max;
 jy=y/max;
 knob.style.left=(33+x)+'px';
 knob.style.top=(33+y)+'px';
}

joy.addEventListener('pointerdown',e=>{
 joy.setPointerCapture(e.pointerId);
 moveJoy(e);
});

joy.addEventListener('pointermove',e=>{
 if(e.buttons)moveJoy(e);
});

function reset(){
 jx=jy=0;
 knob.style.left='33px';
 knob.style.top='33px';
}

joy.addEventListener('pointerup',reset);
joy.addEventListener('pointercancel',reset);

// چرخاندن نگاه با کشیدن انگشت
let look=null;

renderer.domElement.addEventListener('touchstart',e=>{
 if(e.touches.length===1){
  look={x:e.touches[0].clientX,y:e.touches[0].clientY};
 }
},{passive:true});

renderer.domElement.addEventListener('touchmove',e=>{
 if(look&&e.touches.length===1){
  const t=e.touches[0];
  yaw-=(t.clientX-look.x)*.005;
  pitch=THREE.MathUtils.clamp(pitch-(t.clientY-look.y)*.003,-.8,.8);
  look={x:t.clientX,y:t.clientY};
 }
},{passive:true});

renderer.domElement.addEventListener('touchend',()=>look=null);

// ورود به فروشگاه
document.querySelector('#enter').onclick=()=>{
 document.querySelector('#entrance').style.display='none';
};

// اجرای سه‌بعدی
function animate(){
 requestAnimationFrame(animate);

 yaw-=jx*.035;

 const f=
  (keys.w||keys.arrowup?-1:0)+
  (keys.s||keys.arrowdown?1:0)-jy;

 const s=
  (keys.d||keys.arrowright?1:0)+
  (keys.a||keys.arrowleft?-1:0);

 const speed=.075;

 camera.position.x+=Math.cos(yaw)*s*speed+Math.sin(yaw)*f*speed;
 camera.position.z+=-Math.sin(yaw)*s*speed+Math.cos(yaw)*f*speed;

 camera.position.x=THREE.MathUtils.clamp(camera.position.x,-9.5,9.5);
 camera.position.z=THREE.MathUtils.clamp(camera.position.z,-10.5,10.5);

 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 renderer.render(scene,camera);
}

animate();
document.querySelector('#loading').style.display='none';

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
