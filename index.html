
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HENZA HOME | گالری فروشگاه</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#fff;
 font-family:Tahoma,Arial,sans-serif;
}
header{
 height:65px;display:flex;align-items:center;
 justify-content:center;background:#fff;
 border-bottom:1px solid #eee;
}
header b{font-size:21px;color:#a17b3c;letter-spacing:2px}
main{
 position:relative;width:100%;height:calc(100% - 65px);
 display:flex;align-items:center;justify-content:center;
 background:#fff;overflow:hidden;
}
#photo{
 width:100%;height:100%;object-fit:contain;
 display:block;transition:opacity .25s;
}
.control{
 position:absolute;top:50%;transform:translateY(-50%);
 width:45px;height:45px;border:0;border-radius:50%;
 background:#ffffffdf;color:#333;
 font-size:27px;box-shadow:0 2px 12px #0002;
 cursor:pointer;
}
#next{left:15px}
#prev{right:15px}
#counter{
 position:absolute;bottom:18px;left:50%;
 transform:translateX(-50%);
 background:#ffffffdf;padding:9px 18px;
 border-radius:30px;font-size:13px;color:#444;
}
</style>
</head>
<body>
<header><b>HENZA HOME</b></header>
<main>
<img id="photo" src="image-1794985931564.jpg" alt="تصویر فروشگاه HENZA HOME">
<button class="control" id="prev" aria-label="تصویر قبلی">›</button>
<button class="control" id="next" aria-label="تصویر بعدی">‹</button>
<div id="counter">۱ از ۲</div>
</main>
<script>
const photos=[
 "image-1794985931564.jpg",
 "image-1794985942259.jpg"
];
let current=0;
const photo=document.getElementById("photo");
const counter=document.getElementById("counter");

function show(index){
 current=(index+photos.length)%photos.length;
 photo.style.opacity="0";
 setTimeout(()=>{
  photo.src=photos[current];
  counter.textContent=(current+1).toLocaleString("fa-IR")+" از ۲";
  photo.style.opacity="1";
 },180);
}
document.getElementById("next").onclick=()=>show(current+1);
document.getElementById("prev").onclick=()=>show(current-1);

let startX=0;
photo.addEventListener("touchstart",e=>{
 startX=e.touches[0].clientX;
},{passive:true});
photo.addEventListener("touchend",e=>{
 const diff=e.changedTouches[0].clientX-startX;
 if(Math.abs(diff)>45)show(current+(diff<0?1:-1));
},{passive:true});

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")show(current+1);
 if(e.key==="ArrowRight")show(current-1);
});
</script>
</body>
</html>
